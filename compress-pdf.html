<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ضغط ملفات PDF أونلاين | محول الصور الذكي</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <style>
        /* التنسيقات لضمان مظهر موحد وسلس */
        .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; flex-wrap: wrap; }
        .nav-menu { display: flex; list-style: none; gap: 15px; margin: 0; padding: 0; }
        .nav-menu a { text-decoration: none; color: white; font-size: 0.9rem; transition: 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { color: #a29bfe; }
        .nav-logo { display: flex; align-items: center; text-decoration: none; color: white; }
        .nav-logo img { width: 32px; height: 32px; margin-left: 10px; border-radius: 5px; }

        .compression-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }
        .stat-item { text-align: center; }
        .stat-label { display: block; color: #a29bfe; font-size: 0.8rem; }
        .stat-value { display: block; color: #00f2ff; font-weight: bold; font-size: 1.1rem; }

        .progress-container { width: 100%; background: rgba(255,255,255,0.1); height: 18px; border-radius: 10px; margin: 20px 0; overflow: hidden; display: none; border: 1px solid rgba(0, 242, 255, 0.3); }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #a29bfe, #00f2ff); width: 0%; transition: 0.3s; text-align: center; font-size: 0.8rem; line-height: 18px; color: #000; font-weight: bold; }
    </style>

    <script src="assets/libs/pdfjs/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="fade-in">
    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/images/favicon.png" alt="Logo">
                <h1>مُحوِّل الصور الذكي</h1>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="merge-pdf.html">📄 دمج</a></li>
                <li><a href="compress-pdf.html" class="active">⚙️ ضغط</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <header class="main-header">
            <h2 class="header-title">ضغط ملفات PDF بذكاء</h2>
            <p class="header-subtitle">قلل حجم مستنداتك مع الحفاظ على الجودة بخصوصية تامة داخل جهازك.</p>
        </header>

        <section class="services-grid" style="grid-template-columns: 1fr; max-width: 700px;">
            <div class="service-card slide-up">
                <div class="service-icon">⚙️</div>
                <h3>أداة تقليص الحجم</h3>

                <div class="upload-section" id="dropArea">
                    <div class="upload-icon">📉</div>
                    <input type="file" id="pdfInput" class="file-input" accept=".pdf">
                    <label for="pdfInput" class="file-label">اضغط هنا لاختيار ملف PDF لضغطه</label>
                </div>

                <div class="compression-stats" id="fileStats" style="display:none;">
                    <div class="stat-item">
                        <span class="stat-label">عدد الصفحات</span>
                        <span class="stat-value" id="pageCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">الحجم الحالي</span>
                        <span class="stat-value" id="originalSize">0 MB</span>
                    </div>
                </div>

                <div style="margin: 20px 0; text-align: right;">
                    <label style="color: #ccc; font-size: 0.9rem;">جودة الضغط: <span id="qualityValue" style="color: #00f2ff;">80%</span></label>
                    <input type="range" id="qualitySlider" min="10" max="100" value="80" style="width: 100%; margin-top: 10px;">
                </div>

                <div class="progress-container" id="progressCont">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn" id="compressBtn" onclick="startCompression()" style="flex: 2;">🚀 بدء عملية الضغط</button>
                    <button class="btn btn-secondary" onclick="location.reload()" style="flex: 1;">إلغاء</button>
                </div>

                <div id="results" style="display:none; margin-top: 20px; padding: 15px; background: rgba(162, 155, 254, 0.1); border-radius: 10px; border: 1px solid #a29bfe;">
                    <p style="color: #00f2ff; margin-bottom: 10px; font-weight: bold;">✅ تم الضغط بنجاح!</p>
                    <p style="font-size: 0.9rem;">الحجم الجديد: <span id="finalNew" style="color: #a29bfe;"></span></p>
                    <a id="downloadLink" class="btn" style="display: block; text-align: center; margin-top: 10px; text-decoration: none;">⬇️ تحميل الملف المضغوط</a>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/pdf-compressor.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'assets/libs/pdfjs/pdf.worker.min.js';
        let currentFile = null;

        // دالة اختيار الملف
        document.getElementById('pdfInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            currentFile = file;

            document.getElementById('fileStats').style.display = 'grid';
            document.getElementById('originalSize').textContent = (file.size / (1024*1024)).toFixed(2) + " MB";
            document.getElementById('results').style.display = 'none';

            const typedarray = new Uint8Array(await file.arrayBuffer());
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            document.getElementById('pageCount').textContent = pdf.numPages;
        });

        document.getElementById('qualitySlider').addEventListener('input', (e) => {
            document.getElementById('qualityValue').textContent = e.target.value + '%';
        });

        // دالة الضغط المصححة
        async function startCompression() {
            if (!currentFile) return alert("اختر ملفاً أولاً");

            const quality = document.getElementById('qualitySlider').value;
            const progressCont = document.getElementById('progressCont');
            const progressBar = document.getElementById('progressBar');
            const compressBtn = document.getElementById('compressBtn');
            const resultsDiv = document.getElementById('results');

            progressCont.style.display = 'block';
            resultsDiv.style.display = 'none';
            compressBtn.disabled = true;

            try {
                const compressedBlob = await compressPDFReal(currentFile, quality, (percent) => {
                    progressBar.style.width = percent + '%';
                    progressBar.textContent = Math.round(percent) + '%';
                });

                resultsDiv.style.display = 'block';
                progressCont.style.display = 'none'; // إخفاء الشريط عند النجاح
                document.getElementById('finalNew').textContent = (compressedBlob.size / (1024*1024)).toFixed(2) + " MB";

                const url = URL.createObjectURL(compressedBlob);
                const dl = document.getElementById('downloadLink');
                dl.href = url;
                dl.download = "compressed_" + currentFile.name;

            } catch (err) {
                alert("خطأ أثناء الضغط: " + err.message);
                progressCont.style.display = 'none';
            } finally {
                compressBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
